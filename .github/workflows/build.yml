name: Build situs

on:
  push:
    paths:
      - 'threads/**'
      - 'skills.json'
      - 'build.py'
      - 'assets/**'
      - 'assets_src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render docs/
        run: python3 build.py
      - name: Commit hasil build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Rebuild situs (otomatis)"
          git push
